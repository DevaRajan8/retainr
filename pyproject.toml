[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retainr"
version = "0.4.0"  
description = "Persistent, queryable AI memory for any Python app — local-first, zero API cost"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.8.0",
    "langchain>=1.3.11",
    "langchain-community>=0.4.2",
    "groq>=1.2.0",
    "langchain-core>=1.4.8",
    "supabase>=2.31.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
groq = ["groq>=1.2.0"]
openai = ["openai>=1.0.0"]
all = ["groq>=1.2.0", "openai>=1.0.0"]

[project.urls]
Homepage = "https://github.com/Devarajan8/memoryos"

[tool.hatch.build.targets.wheel]
packages = ["retainr"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]
