[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memoryos-official"
version = "0.1.1"
description = "Persistent, queryable AI memory for any Python app — local-first, zero API cost"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.8.0",
    "groq>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/Devarajan8/memoryos"

[tool.hatch.build.targets.wheel]
packages = ["memoryos"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
